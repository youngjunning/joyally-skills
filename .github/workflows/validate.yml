name: Validate skills
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests
      - run: python3 skills/design/joyally-design/scripts/validate-joyally-tokens.py
      - run: python3 -m unittest discover -s skills/writing/joyally-writing/tests
      - run: python3 -m pip install -r skills/design/joyally-image/requirements.txt
      - run: python3 -m unittest discover -s skills/design/joyally-image/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/design/joyally-image/tests
      - name: Validate standalone Joyally Image installation
        run: |
          standalone_root="$(mktemp -d)"
          mkdir -p "$standalone_root/joyally-image"
          git archive HEAD skills/design/joyally-image | tar -x -C "$standalone_root/joyally-image" --strip-components=3
          python3 -m unittest discover -s "$standalone_root/joyally-image/tests"
      - run: python3 skills/design/joyally-design/scripts/validate-native-tokens.py
      - run: node skills/design/joyally-image/scripts/joyally-diagram.mjs doctor
      - run: node skills/design/joyally-image/scripts/joyally-diagram.mjs validate workflow skills/design/joyally-image/examples/interactive-minimal.workflow.json --json
      - run: node --test skills/design/joyally-image/scripts/test_validate_diagram_layout.mjs
