<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distill Me · 本地工作台</title>
  <style>
    :root { --ink:#17201c; --muted:#65726b; --paper:#f6f5ef; --panel:#fffef9; --line:#d9ded7; --moss:#1e6249; --mint:#daf0df; --sun:#f2c969; --danger:#9a3e32; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(135deg,#e9f1ea 0%,var(--paper) 46%,#f4e9cf 100%); font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:34px 22px 54px; } header { display:flex; gap:20px; align-items:end; justify-content:space-between; margin-bottom:22px; } h1 { margin:0; font:700 clamp(30px,5vw,52px)/.98 Georgia,"Songti SC",serif; letter-spacing:-.045em; } h1 span { color:var(--moss); } .eyebrow { color:var(--moss); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:9px; } .tag { border:1px solid #b4d1be; background:#eff9ef; color:#24533e; border-radius:999px; padding:6px 10px; font-size:12px; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr); gap:18px; } .panel { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid rgba(130,148,137,.35); border-radius:20px; box-shadow:0 14px 45px rgba(47,77,59,.08); padding:21px; } h2 { margin:0 0 4px; font-size:18px; } p.hint { margin:0 0 16px; color:var(--muted); font-size:13px; }
    label { display:block; font-size:12px; font-weight:800; color:#425048; margin:14px 0 6px; } textarea,input,select { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; color:var(--ink); background:#fff; font:inherit; } textarea { min-height:200px; resize:vertical; } input:focus,textarea:focus,select:focus { outline:3px solid #b7dfc3; border-color:var(--moss); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; } button,.file-label { appearance:none; border:1px solid #b5c2ba; background:#fff; color:#23342b; padding:8px 11px; border-radius:9px; font:700 13px/1.2 inherit; cursor:pointer; } button.primary { background:var(--moss); color:#fff; border-color:var(--moss); } button.warn { color:var(--danger); } button:hover,.file-label:hover { filter:brightness(.97); } .file-label input { display:none; }
    .preset { display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px dashed var(--line); } .preset input { width:16px; height:16px; accent-color:var(--moss); } .preset label { margin:0; flex:1; font-size:14px; } .preset button { padding:4px 8px; font-size:12px; }
    .new { display:flex; gap:8px; margin:15px 0 0; } .new input { min-width:0; } .drafts { margin-top:18px; display:grid; gap:10px; } .card { padding:13px; border:1px solid var(--line); border-left:5px solid var(--moss); border-radius:12px; background:#fff; } .card-head { display:flex; justify-content:space-between; gap:8px; align-items:center; } .card small { color:var(--muted); } .card p { margin:7px 0 0; white-space:pre-wrap; } .empty { padding:17px; background:#f3f5f1; border-radius:12px; color:var(--muted); text-align:center; }
    dialog { max-width:min(690px,calc(100vw - 32px)); border:0; border-radius:18px; padding:0; box-shadow:0 18px 70px rgba(0,0,0,.25); } dialog::backdrop { background:rgba(20,35,26,.45); } dialog section { padding:22px; } pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:13px; background:#18251f; color:#e5f5e9; border-radius:12px; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; } .footer { color:var(--muted); font-size:12px; margin:18px 3px 0; }
    @media (max-width:760px) { main{padding:23px 14px 38px} header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.tag{white-space:normal}.panel{padding:17px} }
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">Distill Me / Local-first</div><h1>把零散信息，<span>留成自己的脉络。</span></h1></div><div class="tag" id="saveState">仅保存在此浏览器</div></header>
  <div class="grid">
    <section class="panel"><h2>材料与草稿</h2><p class="hint">先贴原话、会议笔记或资料摘要。此页面不发送任何内容。</p><label for="source">本次材料</label><textarea id="source" placeholder="例如：会议记录、聊天片段、读到的资料摘要……"></textarea><label for="note">编辑备注（可选）</label><input id="note" placeholder="这次想整理什么？"><div class="actions"><button class="primary" id="makePrompt">生成给 Agent 的请求</button><button id="addDraft">加入本地草稿</button><button class="warn" id="clear">清空本次材料</button></div><div class="drafts" id="drafts"></div></section>
    <section class="panel"><h2>这次需要哪些栏目？</h2><p class="hint">预设只是起点。取消不需要的、改名或新增均可。</p><div id="buckets"></div><div class="new"><input id="bucketName" placeholder="新增栏目，例如：待验证假设"><button id="addBucket">添加</button></div><div class="actions"><button id="export">导出 JSON</button><label class="file-label">导入 JSON<input type="file" id="import" accept="application/json"></label><button id="reset">恢复预设</button></div></section>
  </div>
  <p class="footer">本地工作台只管理草稿。要写入文件、知识库或其他系统，请在复制给 Agent 的请求中明确目标位置与授权。</p>
</main>
<dialog id="promptDialog"><section><h2>复制给 Agent</h2><p class="hint">Agent 会先整理草稿；除非你在对话中明确指定写入位置和授权，否则不应保存到外部位置。</p><pre id="prompt"></pre><div class="actions"><button class="primary" id="copy">复制请求</button><button id="close">关闭</button></div></section></dialog>
<script>
(() => {
  const key='distill-me-workbench-v1'; const defaults=['重要判断','关键进展','资料收藏','待跟进','文章草稿'];
  let state={source:'',note:'',buckets:[...defaults],drafts:[]};
  const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(){try{const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.buckets))state={...state,...x};}catch{ $('saveState').textContent='浏览器未启用本地保存'; }}
  function save(){state.source=$('source').value;state.note=$('note').value;try{localStorage.setItem(key,JSON.stringify(state));$('saveState').textContent='已保存在此浏览器';}catch{$('saveState').textContent='可编辑，但无法本地保存';}}
  function render(){ $('source').value=state.source;$('note').value=state.note; $('buckets').innerHTML=state.buckets.map((b,i)=>`<div class="preset"><input type="checkbox" data-i="${i}" checked><label>${esc(b)}</label><button data-remove="${i}" aria-label="删除 ${esc(b)}">删除</button></div>`).join(''); const cards=state.drafts.slice().reverse().map(d=>`<article class="card"><div class="card-head"><strong>${esc(d.title)}</strong><small>${new Date(d.at).toLocaleString()}</small></div><small>${esc(d.buckets.join(' · ')||'未选栏目')}</small><p>${esc(d.source)}</p></article>`).join('');$('drafts').innerHTML=cards||'<div class="empty">还没有本地草稿。贴入材料后点击“加入本地草稿”。</div>'; }
  function selected(){return [...document.querySelectorAll('#buckets input:checked')].map(x=>state.buckets[Number(x.dataset.i)]);}
  function prompt(){const items=selected();return `请用 distill-me 整理以下材料。\n\n启用栏目：${items.join('、')||'由内容决定'}\n${state.note?`编辑备注：${state.note}\n`:''}\n要求：仅输出草稿；保留来源与不确定性；不要把你的建议写成我的事实；不要写入、发布或同步到任何位置，除非我随后明确给出目标与授权。\n\n材料：\n${state.source||'（请先填写材料）'}`;}
  $('addBucket').onclick=()=>{const v=$('bucketName').value.trim();if(v&&!state.buckets.includes(v)){state.buckets.push(v);$('bucketName').value='';save();render();}};
  $('buckets').onclick=e=>{const i=e.target.dataset.remove;if(i!==undefined){state.buckets.splice(Number(i),1);save();render();}};
  $('makePrompt').onclick=()=>{$('prompt').textContent=prompt();$('promptDialog').showModal();};
  $('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制请求',1200);}catch{ $('copy').textContent='请手动复制'; }};
  $('close').onclick=()=>$('promptDialog').close();
  $('addDraft').onclick=()=>{if(!$('source').value.trim())return;$('source').value&&state.drafts.push({title:state.note||'未命名草稿',source:$('source').value,buckets:selected(),at:Date.now()});save();render();};
  $('clear').onclick=()=>{if(confirm('清空本次材料？本地草稿不会被删除。')){$('source').value='';$('note').value='';save();}};
  $('reset').onclick=()=>{if(confirm('恢复四个预设栏目？当前自定义栏目会被替换。')){state.buckets=[...defaults];save();render();}};
  $('export').onclick=()=>{save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='distill-me-draft.json';a.click();URL.revokeObjectURL(a.href);};
  $('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.buckets))throw Error();state={...state,...x};save();render();}catch{alert('这不是有效的 Distill Me 导出文件。');}};r.readAsText(f);};
  ['source','note'].forEach(id=>$(id).addEventListener('input',save));load();render();
})();
</script>
</body>
</html>
